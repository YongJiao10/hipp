# Current hippo2 stack; install the documented local patch after HippUnfold.
# Use flexible channel priority; native Greedy and Convert3D select their channels explicitly.
# Workbench is a separate PATH binary documented in the runtime manifest.
name: hippo2
channels:
- conda-forge
- khanlab
- bioconda
